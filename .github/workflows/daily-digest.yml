# Scheduling lives in vercel.json (Vercel Pro cron, per-minute precision).
# This workflow is manual-only on purpose -- no `schedule:` trigger, so it can
# never double-post alongside Vercel. Kept as a fallback path if Vercel is
# ever down or the endpoint needs to be exercised from CI.
name: Bond Buyer digest (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the Slack payload instead of posting"
        type: boolean
        default: true
      lookback_hours:
        description: "Override the article window (hours)"
        type: string
        default: ""

jobs:
  digest:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/digest.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
